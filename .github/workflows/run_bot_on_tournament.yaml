name: Forecast on new AI tournament questions

on:
  workflow_dispatch:

  schedule:
    - cron: "7,27,47 * * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast_job:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run forecasting bot
        run: poetry run python main.py --mode tournament

        env:
          # -------------------------------------------------------------------
          # Required secrets
          # -------------------------------------------------------------------

          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

          # -------------------------------------------------------------------
          # Model configuration
          #
          # These should be repository Variables, not Secrets.
          # -------------------------------------------------------------------

          HF_MAIN_BRAIN_MODEL: ${{ vars.HF_MAIN_BRAIN_MODEL }}
          HF_INFERENCE_PROVIDER: ${{ vars.HF_INFERENCE_PROVIDER }}

          OPENROUTER_QUERY_MODEL: ${{ vars.OPENROUTER_QUERY_MODEL }}
          OPENROUTER_HELPER_MODEL: ${{ vars.OPENROUTER_HELPER_MODEL }}
          OPENROUTER_PARSER_MODEL: ${{ vars.OPENROUTER_PARSER_MODEL }}

          # -------------------------------------------------------------------
          # Optional research providers
          # -------------------------------------------------------------------

          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
