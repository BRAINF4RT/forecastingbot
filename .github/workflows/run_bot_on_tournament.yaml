name: Forecast on new AI tournament questions

on:
  workflow_dispatch:

  schedule:
    # Run every 20 minutes.
    - cron: "7,27,47 * * * *"

concurrency:
  group: forecasting-bot-tournament
  cancel-in-progress: false

jobs:
  forecast_job:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Install Poetry dependencies
        run: |
          poetry install --no-interaction --no-root

      - name: Install research dependencies
        run: |
          poetry run pip install \
            trafilatura \
            beautifulsoup4 \
            ddgs \
            httpx

      - name: Run forecasting bot
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

          # The bot is deliberately locked to this free model.
          OPENROUTER_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free

          # Optional research providers.
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

        run: |
          poetry run python main.py --mode tournament
