```yaml
name: Forecast on new AI tournament questions

on:
  workflow_dispatch:

  schedule:
    # Check for new tournament questions every 10 minutes.
    # Offset from the top of the hour to reduce GitHub scheduler congestion.
    - cron: "7,17,27,37,47,57 * * * *"

jobs:
  forecast_job:
    runs-on: ubuntu-latest

    # Allow enough time for:
    # - dependency installation
    # - web research
    # - OpenRouter model retries/fallbacks
    # - forecasting multiple questions
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.1.1"
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Refresh Poetry lock file
        run: poetry lock

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run forecasting bot
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

        run: |
          poetry run python main.py --mode tournament
```
